[project]
name = "hark-client"
version = "0.1.0"
description = "hark POC client: hotkey, audio, context, gRPC streaming, cleanup, guardrails, paste"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hark-proto",
    "grpcio>=1.85",
    "protobuf>=6.31",
]

[project.scripts]
hark = "hark_client.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hark_client"]

[tool.uv.sources]
hark-proto = { workspace = true }
