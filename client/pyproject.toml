[project]
name = "skriv-client"
version = "0.1.0"
description = "skriv POC client: hotkey, audio, context, gRPC streaming, cleanup, guardrails, paste"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "skriv-proto",
    "grpcio>=1.85",
    "grpcio-health-checking>=1.85",
    "protobuf>=6.31",
    "numpy>=2.0",
    "psutil>=7",
    "soxr>=0.5",
    "sounddevice>=0.5",
    # macOS: push-to-talk hotkey, NSPasteboard, CGEvent paste, AX focus/selection
    "pynput>=1.8 ; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=11 ; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=11 ; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=11 ; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# Linux X11 only: global push-to-talk via pynput (Wayland uses `skriv ctl` from compositor binds).
x11 = ["pynput>=1.8"]
# Linux desktop: recording indicator (GTK 4 + gtk4-layer-shell) and AT-SPI caret/read-back.
# Built from sdist (no Linux wheels): needs gobject-introspection, cairo and a C compiler.
gi = [
    "PyGObject>=3.52 ; sys_platform == 'linux'",
    "pycairo>=1.27 ; sys_platform == 'linux'",
]

[project.scripts]
skriv = "skriv_client.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skriv_client"]

[tool.uv.sources]
skriv-proto = { workspace = true }
