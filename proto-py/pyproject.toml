[project]
name = "skriv-proto"
version = "0.1.0"
description = "Generated Python stubs for the skriv.v1 protocol (proto/skriv/v1/skriv.proto)"
requires-python = ">=3.12,<3.13"
dependencies = ["grpcio>=1.85", "protobuf>=6.31"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skriv"]
