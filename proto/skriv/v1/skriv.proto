// skriv client <-> inference-server protocol, skriv.v1 (gRPC + protobuf)
// Status: FINAL v1.0 (ADR-001). Base: docs/protocol/proposal-a.proto with the
// ADR-001 amendments applied; differences are listed in
// docs/protocol/CHANGES.md. Rationale: docs/protocol/proposal-a.md.
//
// Conventions (normative)
// - All strings are UTF-8. Every "*_byte_*" offset is a UTF-8 byte offset
//   into the string named in the comment, half-open [start, end).
// - All audio times are integer milliseconds from sample 0 of the utterance
//   (the first sample of the first AudioChunk, i.e. including pre-roll).
// - Scalars whose zero value is meaningful use proto3 `optional`.
// - Every enum's value 0 is *_UNSPECIFIED and means "server default" or
//   "unknown". Receivers MUST treat unknown enum values like UNSPECIFIED.
// - Compatibility: additive changes only within package skriv.v1 (bump
//   Capabilities.protocol.minor). Never renumber or reuse a field number;
//   `reserved` removed ones. Breaking changes => package skriv.v2, served
//   side by side. Enforced in CI with `buf breaking`.
// - Required-ness is enforced by the receiver's validation code, not by
//   proto (proto3 has no required). Violations => INVALID_ARGUMENT.
// - Audio (ADR-001 #8): PCM s16le, 16 kHz, mono, 40 ms chunks (640 samples).
// - Security (ADR-001 #9): mTLS with a private CA is the default; a bearer
//   token is optional; plaintext is for loopback/UDS only. Tailscale is the
//   network layer, not authentication.

syntax = "proto3";

package skriv.v1;

// =============================================================================
// Services
// =============================================================================

// Speech recognition. One server process may host several models.
// Also implement grpc.health.v1.Health with service names
// "" (process), "skriv.v1.Asr", "skriv.v1.TextCleanup".
service Asr {
  // Cheap and cacheable. Call on connect, on reconnect, and whenever
  // SessionAccepted.capabilities_etag differs from the cached etag.
  rpc GetCapabilities(GetCapabilitiesRequest) returns (Capabilities);

  // Primary path. One call == one utterance.
  // Client -> server: start, (audio | context_update)*, end_of_audio | cancel,
  //                   (eager_end may be interleaved), then half-close.
  // Server -> client: [accepted], (partial | status | warning)*, then EXACTLY
  //                   ONE terminal message: final_result or session_ended.
  //   - final_result  => the call ends with status OK.
  //   - session_ended => the call ends with the non-OK status that mirrors
  //                      session_ended.error (ErrorDetail also packed in
  //                      google.rpc.Status.details).
  //   This holds on every path the server can still write to, including
  //   rejection before `accepted` and explicit Cancel. Only transport
  //   failures (RST_STREAM, connection loss, deadline) end a call without a
  //   terminal message; the client treats those as SessionEnded{FAILED}.
  rpc Transcribe(stream TranscribeRequest) returns (stream TranscribeResponse);
}

// Optional post-ASR cleanup: an LLM rewrite of the text, checked by the client.
service TextCleanup {
  rpc Cleanup(CleanupRequest) returns (CleanupResponse);
}

// =============================================================================
// Capability negotiation
// =============================================================================

message GetCapabilitiesRequest {
  reserved 2;
  reserved "client_protocol_minor";
  string client_version = 1;        // e.g. "skriv/0.3.1 (linux-x86_64)"
}

message ProtocolVersion {
  uint32 major = 1; // always 1 in package skriv.v1
  uint32 minor = 2; // additive revisions
}

message Capabilities {
  ProtocolVersion protocol = 1;
  ServerInfo server = 2;
  repeated ModelCapabilities models = 3;
  repeated CleanupProfile cleanup_profiles = 4; // empty => no TextCleanup
  ServerLimits limits = 5;
  // Opaque; changes whenever anything in this message changes (model load
  // state included). Echoed in SessionAccepted.
  string etag = 6;
  // Small namespaced boolean features. Unknown strings MUST be ignored.
  // Defined: "skriv.midstream_context", "skriv.cleanup", "skriv.eager_end".
  repeated string features = 7;
  // Which PrivacyFlags permissions this server can act on. Sessions that set
  // an unsupported allow_* flag are rejected (see PrivacyFlags).
  PrivacyCapabilities privacy = 8;
}

message PrivacyCapabilities {
  bool audio_retention = 1;
  bool transcript_retention = 2;
  bool context_logging = 3;
  bool eval_capture = 4;
  bool replay_cache = 5;
}

message ServerInfo {
  string name = 1;           // user-visible, e.g. "desktop-3060"
  string implementation = 2; // e.g. "skriv-server-py/0.2.0 nemo/2.x"
  string accelerator = 3;    // e.g. "RTX 3060 12GB", "Apple M5 Pro", "cpu"
  uint64 started_unix_ms = 4;
  string instance_id = 5;    // random per process start; change => caches gone
}

message ServerLimits {
  uint32 max_concurrent_sessions = 1;
  uint32 max_audio_ms = 2;
  uint32 max_message_bytes = 3;
  uint32 replay_cache_ttl_ms = 4; // 0 => no replay cache
}

message ModelCapabilities {
  string model_id = 1;     // stable id used in SessionStart.model_id
  string display_name = 2;
  string family = 3;       // e.g. "parakeet-tdt-0.6b-v3", "qwen3-asr-1.7b"
  ModelState state = 4;
  bool is_default = 5;

  repeated string languages = 6; // BCP-47 tags; empty => unknown
  bool language_detection = 7;

  StreamingMode streaming_mode = 8;
  bool partials = 9;
  repeated AudioFormatSupport audio_formats = 10;

  BiasCapabilities bias = 11;
  FreeTextCapabilities free_text = 12;
  NBestCapabilities n_best = 13;
  TimestampCapabilities timestamps = 14;
  AnchorCost anchor_cost = 15;

  bool punctuation = 16;
  bool casing = 17;
  bool inverse_text_normalization = 18;

  PerfEstimate perf = 19; // measured at warmup on this host; advisory
}

message AudioFormatSupport {
  AudioEncoding encoding = 1;
  repeated uint32 sample_rates_hz = 2; // accepted input rates
}

message BiasCapabilities {
  reserved 5, 11;
  reserved "max_total_tokens", "hit_scores";
  BiasMechanism mechanism = 1;
  uint32 max_terms = 2;
  uint32 max_aliases_per_term = 3;
  uint32 max_term_bytes = 4;
  bool per_term_weight = 6;
  bool aliases_supported = 7;    // aliases influence recognition/matching
  bool case_insensitive = 8;     // canonical casing need not match model casing
  MidstreamUpdate midstream_update = 9;
  bool bias_with_n_best = 10;    // N-best comes from the biased decode
  // Native boost scale of this backend (e.g. Riva SpeechContext.boost, GPU-PB
  // per-phrase alpha). BiasTerm.weight w in [0,1] maps by default to
  // boost_min + w * (boost_max - boost_min); the applied value per term is
  // reported in AppliedConfig.term_boosts. Both 0 for mechanism NONE.
  float boost_min = 12;
  float boost_max = 13;
}

message FreeTextCapabilities {
  reserved 4;
  reserved "echo_risk";
  bool description = 1;
  bool preceding_text = 2;
  uint32 max_bytes = 3;
}

message NBestCapabilities {
  uint32 max_n = 1; // 1 => best only
  ScoreKind score_kind = 2;
}

message TimestampCapabilities {
  TimestampSource source = 1;
  uint32 resolution_ms = 2;         // e.g. 80 for 8x-subsampled FastConformer
  bool word_confidence = 3;
  bool confidence_calibrated = 4;   // only if validated on held-out data
}

message PerfEstimate {
  reserved 3;
  reserved "bias_compile_ms";
  float rtfx = 1;               // audio seconds per wall second, one stream
  uint32 finalize_ms_10s = 2;   // EndOfAudio -> FinalResult, 10 s audio, p50
}

// =============================================================================
// Transcribe: client -> server
// =============================================================================

message TranscribeRequest {
  oneof msg {
    SessionStart start = 1;          // MUST be first, exactly once
    AudioChunk audio = 2;
    ContextUpdate context_update = 3;
    EndOfAudio end_of_audio = 4;     // at most once; no audio afterwards
    Cancel cancel = 5;
    EagerEnd eager_end = 6;          // hint; only if feature "skriv.eager_end"
  }
}

message SessionStart {
  reserved 2;
  reserved "attempt";
  string utterance_id = 1;       // client UUIDv7; idempotency/correlation key
  string model_id = 3;           // empty => server default model
  repeated string languages = 4; // BCP-47; empty => detect; [0] = primary
  AudioFormat audio_format = 5;
  RecognitionContext context = 6;
  PrivacyFlags privacy = 7;
  ResultOptions options = 8;
  Deadlines deadlines = 9;
  ClientInfo client = 10;
  // Feature names (Capabilities.features or "result.word_timestamps",
  // "result.word_confidence", "result.n_best", "result.anchor", "bias",
  // "free_text") that MUST be honored; otherwise the call fails with
  // FAILED_PRECONDITION and ErrorDetail.code = REQUIRED_FEATURE_UNAVAILABLE
  // (unknown names fail too). Required result fields are never shed for
  // budget. Others are best effort.
  repeated string required_features = 11;
  // Escape hatch, namespaced by backend, e.g. "nemo.boosting_tree_alpha".
  // Servers MUST ignore unknown keys and report used ones in AppliedConfig.
  map<string, string> backend_params = 15;
}

// Unset fields take the v1 defaults: encoding UNSPECIFIED => PCM_S16LE,
// sample_rate_hz 0 => 16000, channels 0 => 1. An absent AudioFormat means
// all defaults.
message AudioFormat {
  AudioEncoding encoding = 1;
  uint32 sample_rate_hz = 2;
  uint32 channels = 3;       // MUST be 1 (or 0 => 1) in v1
  uint32 preroll_ms = 4;     // audio captured before hotkey-down (ring buffer)
}

message RecognitionContext {
  uint32 revision = 1;       // 1, 2, ... strictly increasing in a session
  BiasList bias = 2;
  FreeTextContext free_text = 3;
}

message BiasList {
  // Ordered by the client ranker, most relevant first. Servers that must
  // truncate drop from the END and report dropped ids.
  repeated BiasTerm terms = 1;
  // Lowercase hex SHA-256 of the protobuf encoding of a BiasList containing
  // only `terms` (fields 2 and 3 unset), as produced by the client. Opaque
  // cache key for compiled bias artifacts, keyed (model_id, content_hash).
  // Empty => do not cache.
  string content_hash = 2;
  // Global strength multiplier applied at decode time. Absent => 1.0.
  // 0.0 => no biasing (decode is effectively the anchor).
  optional float strength = 3;
}

// One term group, Riva-aligned (ADR-001 #1): {canonical, aliases..., weight}
// maps 1:1 onto a Riva SpeechContext{phrases=[canonical, aliases...], boost}.
// The client never sends backend-native boost values: `weight` is a
// normalized relevance in [0, 1]; the server converts it to its native scale
// (BiasCapabilities.boost_min/boost_max) and reports the applied value in
// AppliedConfig.term_boosts. weight 0 => the lowest native boost (still
// listed, e.g. for hit detection), not "disabled"; to disable biasing use
// BiasList.strength = 0. Out-of-range weights => INVALID_ARGUMENT.
message BiasTerm {
  string id = 1;          // client-stable id, non-empty, unique within the list
  string canonical = 2;   // exact desired output: "PyTorch", "kubectl"
  repeated SpokenAlias aliases = 3;
  optional float weight = 4; // normalized relevance in [0, 1]; absent => 1.0
  TermKind kind = 5;
  repeated ContextSource provenance = 6; // empty if privacy.minimal_metadata
  string language = 7;    // BCP-47 if different from session primary
}

// Aliases share their term's weight: a Riva SpeechContext has one boost for
// all of its phrases.
message SpokenAlias {
  reserved 3;
  reserved "weight";
  string text = 1;            // "pie torch", "cube control", "k u b e c t l"
  AliasKind kind = 2;
}

message FreeTextContext {
  // Short natural-language description, already redacted by the client, e.g.
  // "Terminal in git repo 'skriv' (Rust), branch feat/vad."
  string description = 1;
  // Text immediately before the caret, already redacted, oldest first.
  string preceding_text = 2;
}

message PrivacyFlags {
  reserved 6;
  reserved "minimal_metadata";
  // All false (the default) == most private. A server MUST NOT do anything
  // not allowed here.
  // Rejection rule (ADR-001 #7): if an allow_* flag is true and the server
  // cannot act on it (not implemented or disabled; see
  // Capabilities.privacy), or if the server would retain/log something
  // regardless of a false flag, it MUST reject the session or request with
  // FAILED_PRECONDITION / ErrorDetail.code = PRIVACY_UNSATISFIABLE, listing
  // the offending flag names (e.g. "privacy.allow_eval_capture") in
  // ErrorDetail.unavailable_features. It MUST NOT silently ignore a flag.
  // The client's per-provider policy remains the real gate.
  bool allow_audio_retention = 1;      // persist audio beyond the call
  bool allow_transcript_retention = 2; // persist text beyond the call
  bool allow_context_logging = 3;      // log bias list/free text (any level)
  bool allow_eval_capture = 4;         // write a dataset record
  bool allow_replay_cache = 5;         // keep FinalResult in RAM for TTL
}

message ResultOptions {
  reserved 2, 7;
  reserved "partial_interval_ms", "bias_diagnostics";
  bool partials = 1;
  uint32 n_best = 3;              // 0 or 1 => best only
  bool word_timestamps = 4;
  bool word_confidence = 5;
  AnchorMode anchor = 6;
  bool n_best_words = 8;          // words for every N-best entry, not only [0]
}

message Deadlines {
  // After EndOfAudio is received the server MUST write FinalResult within
  // this budget, dropping optional work (N-best, anchor, alignment) as
  // needed and setting ResultFlags. 0 => server default.
  uint32 finalize_budget_ms = 1;
  // Hard cap on utterance audio; beyond it the call fails AUDIO_TOO_LONG.
  uint32 max_audio_ms = 2;
}

message ClientInfo {
  reserved 2;
  reserved "device_id";
  string client_version = 1;
}

// Placement is by `start_sample` (ADR-001 #2). Let `received` be the end of
// the audio received so far (0 at start):
// - start_sample == received: append.
// - start_sample >  received: gap. The server zero-fills, emits
//   warning{AUDIO_GAP} and sets FinalResult.flags.audio_gap.
// - start_sample <  received: overlap => PROTOCOL_VIOLATION (a gRPC call
//   is ordered; resumes/retries use a new call with full replay).
// `seq` MUST be strictly increasing from 0 (contiguous unless chunks were
// lost before sending); it is for correlation and acks only.
// For PCM_S16LE, num_samples MUST equal len(data) / 2.
message AudioChunk {
  reserved 5;
  reserved "vad_speech_prob";
  bytes data = 1;          // PCM_S16LE samples
  uint64 seq = 2;          // 0, 1, 2, ... strictly increasing
  uint64 start_sample = 3; // index of first sample at AudioFormat rate
  uint32 num_samples = 4;  // samples this chunk represents (decoded, mono)
}

message ContextUpdate {
  RecognitionContext context = 1; // full replacement of the previous context
}

// last_seq and total_samples MUST match what the server received (seq of the
// last chunk; end sample of the last chunk incl. zero-filled gaps), else
// PROTOCOL_VIOLATION. With no audio at all, both are 0.
message EndOfAudio {
  uint64 last_seq = 1;
  uint64 total_samples = 2;
  EndReason reason = 3;
}

// Eager finalize (ADR-001 #3). The client VAD saw a pause while the key is
// still held. The server MAY start a speculative finalize over all audio
// received so far (with the current context revision). Any later AudioChunk
// or ContextUpdate invalidates the speculative result; a newer EagerEnd
// replaces it. If EndOfAudio arrives while the speculative result is still
// valid, the server returns it (Timings.eager_hit = true). Consequence for
// clients: after EagerEnd, hold back further chunks while VAD reports
// non-speech and send them only if speech resumes; at key-up send
// EndOfAudio for the audio actually sent. Hint only: never required.
message EagerEnd {
  reserved 2;
  reserved "speech_end_sample";
  // Samples sent before this message (== start_sample + num_samples of the
  // last chunk). A mismatch makes the server ignore this hint.
  uint64 total_samples = 1;
}

message Cancel {
  CancelReason reason = 1;
}

// =============================================================================
// Transcribe: server -> client
// =============================================================================

message TranscribeResponse {
  reserved 2;
  reserved "partial";
  oneof msg {
    SessionAccepted accepted = 1;     // exactly once, first
    FinalResult final_result = 3;     // terminal (success)
    StreamStatus status = 4;
    ServerWarning warning = 5;
    SessionEnded session_ended = 6;   // terminal (no result)
  }
}

// Terminal message for every session that does not produce a FinalResult
// (ADR-001 #4). Exactly one of final_result / session_ended per call.
message SessionEnded {
  SessionEndReason reason = 1;
  ErrorDetail error = 2;      // always set (code CANCELLED for CANCELLED)
  string utterance_id = 3;    // echoed if known
}

message SessionAccepted {
  reserved 6;
  reserved "replayed";
  string session_id = 1;
  string model_id = 2;
  AppliedConfig applied = 3;
  uint64 server_time_unix_ms = 4;
  string capabilities_etag = 5;
}

message AppliedConfig {
  BiasMechanism bias_mechanism = 1;
  uint32 bias_terms_used = 2;
  repeated string bias_terms_dropped = 3; // ids
  bool free_text_used = 4;
  uint32 n_best = 5;
  bool anchor_planned = 6;
  bool word_timestamps = 7;
  bool word_confidence = 8;
  // Effective backend values, incl. weight->boost mapping, e.g.
  // {"nemo.boosting_model_alpha": "1.5", "riva.boost_buckets": "2,3,4"}.
  map<string, string> backend_params = 9;
  // BiasTerm.id -> boost actually applied, in the backend's native scale
  // (BiasCapabilities.boost_min..boost_max, after BiasList.strength). Only
  // for terms that reach the decoder; empty for mechanism NONE.
  map<string, float> term_boosts = 10;
}

message StreamStatus {
  uint32 audio_received_ms = 1;
  uint32 audio_processed_ms = 2; // == received for BUFFERED servers
  uint32 queued_sessions = 3;
  uint64 samples_received = 4;   // ack: end sample of audio received so far
}

message ServerWarning {
  WarningCode code = 1;
  string message = 2;            // never contains user text/context
  repeated string term_ids = 3;
}

message FinalResult {
  reserved 6, 10, 11;
  reserved "language_confidence", "privacy", "replayed";
  string utterance_id = 1;
  // n_best[0] is the primary result. Always present (empty text on silence).
  repeated Hypothesis n_best = 2;
  // Same audio, same model, NO bias list, NO free-text context.
  // Absent when not requested, unavailable or skipped (see flags).
  Hypothesis anchor = 3;
  repeated BiasHit bias_hits = 4;
  string detected_language = 5;  // BCP-47
  uint32 context_revision = 7;   // context revision actually used
  Timings timings = 8;
  ResultFlags flags = 9;
  // Model that produced n_best[0] (v1.1). Differs from SessionAccepted.model_id
  // after a language fallback (WARNING_CODE_LANGUAGE_FALLBACK). Empty: the
  // accepted model (servers before v1.1).
  string model_id = 12;
}

message Hypothesis {
  string text = 1;
  repeated Word words = 2;
  optional float score = 3;
  ScoreKind score_kind = 4;
  optional float confidence = 5; // utterance-level, [0, 1]
  HypothesisOrigin origin = 6;
}

message Word {
  string text = 1;
  uint32 start_ms = 2;
  uint32 end_ms = 3;
  optional float confidence = 4; // absent if backend has none or a placeholder
  uint32 text_byte_start = 5;    // into the parent Hypothesis.text
  uint32 text_byte_end = 6;
  string bias_term_id = 7;       // set if the word lies inside a BiasHit span
}

message BiasHit {
  reserved 11, 12;
  reserved "term_score", "anchor_score";
  string term_id = 1;
  string matched_form = 2;       // canonical or alias text that matched
  bool via_alias = 3;
  BiasHitDecision decision = 4;
  BiasMechanism mechanism = 5;
  uint32 text_byte_start = 6;    // span in n_best[0].text
  uint32 text_byte_end = 7;
  uint32 start_ms = 8;
  uint32 end_ms = 9;
  string anchor_text = 10;       // anchor words overlapping [start_ms, end_ms)
  optional float boost = 13;        // effective boost, backend scale
}

message Timings {
  reserved 4, 5, 11;
  reserved "bias_cache_hit", "lag_at_end_ms", "alignment_ms";
  uint32 audio_ms = 1;
  uint32 queue_ms = 2;
  uint32 bias_prepare_ms = 3;
  uint32 end_to_final_ms = 6;    // EndOfAudio received -> FinalResult written
  uint32 encoder_ms = 7;
  uint32 decode_ms = 8;
  uint32 anchor_ms = 9;
  uint32 n_best_ms = 10;
  uint32 postprocess_ms = 12;
  uint64 server_end_received_unix_us = 13;
  uint64 server_final_sent_unix_us = 14;
  map<string, uint32> backend_ms = 15;
  bool eager_hit = 16;           // result came from a speculative EagerEnd decode
}

// Degradation and per-field status (ADR-001 #5: proposal-b's quality/omitted
// merged in). Every optional result field reports PRESENT / NOT_REQUESTED /
// SKIPPED_BUDGET / UNSUPPORTED / FAILED. How far a present field can be
// trusted is static per model (ModelCapabilities: timestamps.source,
// confidence_calibrated, anchor_cost, bias_with_n_best) plus
// Hypothesis.origin and AppliedConfig for this session.
message ResultFlags {
  reserved 2, 3, 4, 6;
  reserved "n_best_skipped", "anchor_skipped", "timestamps_skipped", "context_echo_suspected";
  // end_to_final_ms > finalize_budget_ms (the primary decode is never shed).
  bool finalize_budget_exceeded = 1;
  bool context_truncated = 5;
  bool no_speech = 7;
  bool audio_gap = 8;            // start_sample gap; server zero-filled
  FieldStatus n_best = 9;        // entries >= 1 of FinalResult.n_best
  FieldStatus anchor = 10;
  FieldStatus word_timestamps = 11;
  FieldStatus word_confidence = 12;
  FieldStatus bias_hits = 13;    // PRESENT even if the list is empty
}

// Packed into google.rpc.Status.details (grpc-status-details-bin) on any
// non-OK status from any skriv RPC.
message ErrorDetail {
  ErrorCode code = 1;
  string message = 2;            // never contains user text/context
  bool retryable = 3;            // safe to retry same utterance, same server
  uint32 retry_after_ms = 4;
  string utterance_id = 5;
  repeated string unavailable_features = 6;
}

// =============================================================================
// TextCleanup
// =============================================================================

message CleanupProfile {
  reserved 3;
  reserved "allowed_kinds";
  string id = 1;                       // "terminal", "chat", "prose"
  string description = 2;
  uint32 max_input_bytes = 4;
  uint32 typical_ms = 5;
  string model = 6;
}

message CleanupRequest {
  reserved 4, 8, 11;
  reserved "protected_spans", "max_edits", "known_terms";
  string request_id = 1;
  string utterance_id = 2;
  string text = 3;                     // client text after fusion/canonicalization
  string profile_id = 5;
  string language = 6;
  CleanupContext context = 7;
  uint32 budget_ms = 9;                // generation budget, < gRPC deadline
  PrivacyFlags privacy = 10;
}

message CleanupContext {
  string app_category = 1;   // "terminal", "chat", "editor", "email", ...
  string preceding_text = 2; // only if the provider's privacy policy allows
}

// The server returns the model's rewrite of the whole text (fillers removed,
// casing, punctuation and wording cleaned). It does not judge fidelity: the
// client checks the rewrite against its input (skriv_client.fidelity) and keeps
// the input when the rewrite adds, drops or reverses anything.
message CleanupResponse {
  reserved 1, 6, 7;
  reserved "edits", "rejected_by_server", "rejections";
  string model = 2;
  uint32 generation_ms = 3;
  uint32 total_ms = 4;
  bool truncated = 5;        // budget hit: no rewrite
  optional string text = 8;  // the rewrite ("" is valid: the input was only fillers)
  string skipped = 9;        // why `text` is unset when not truncated: "empty",
                             // "not_english", "max_tokens"
}

// =============================================================================
// Enums (values prefixed per buf STANDARD lint rules)
// =============================================================================

enum ModelState {
  MODEL_STATE_UNSPECIFIED = 0;
  MODEL_STATE_LOADING = 1;
  MODEL_STATE_READY = 2;
  MODEL_STATE_COLD = 3;      // not loaded yet
  MODEL_STATE_FAILED = 4;
}

enum StreamingMode {
  STREAMING_MODE_UNSPECIFIED = 0;
  STREAMING_MODE_BUFFERED = 1;    // audio streamed in, decoded at EndOfAudio
  STREAMING_MODE_INCREMENTAL = 2; // decoded while audio arrives
}

enum AudioEncoding {
  reserved 2;
  reserved "AUDIO_ENCODING_OPUS";
  AUDIO_ENCODING_UNSPECIFIED = 0;
  AUDIO_ENCODING_PCM_S16LE = 1;
}

enum BiasMechanism {
  reserved 3, 4;
  reserved "BIAS_MECHANISM_ACOUSTIC_RESCORE", "BIAS_MECHANISM_PROMPT";
  BIAS_MECHANISM_UNSPECIFIED = 0;
  BIAS_MECHANISM_NONE = 1;
  BIAS_MECHANISM_DECODE_TIME_BOOST = 2; // shallow-fusion boosting (GPU-PB, Riva)
}

enum MidstreamUpdate {
  reserved 3;
  reserved "MIDSTREAM_UPDATE_FORWARD_ONLY";
  MIDSTREAM_UPDATE_UNSPECIFIED = 0;
  MIDSTREAM_UPDATE_UNSUPPORTED = 1;  // only SessionStart context is used
  MIDSTREAM_UPDATE_FULL = 2;         // latest revision applies to all audio
}

enum ScoreKind {
  reserved 1, 2, 3;
  reserved "SCORE_KIND_LOG_PROB", "SCORE_KIND_LOG_PROB_PER_TOKEN", "SCORE_KIND_POSTERIOR";
  SCORE_KIND_UNSPECIFIED = 0;
  SCORE_KIND_RANK_ONLY = 4;          // order meaningful, values are not
}

