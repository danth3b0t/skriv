[project]
name = "hark-workspace"
version = "0.1.0"
description = "hark repository root: uv workspace + shared dev tooling"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["proto-py", "server", "client"]

[tool.uv.sources]
hark-server = { workspace = true, editable = true }
hark-client = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "commitizen>=4.19.3",
    "grpcio-tools>=1.85.1",
    "hark-client",
    "hark-server[mlx]",
    "lefthook>=2.2.2",
    "mypy-protobuf>=5.1.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "ty==0.0.101",
    "types-grpcio>=1.85.0.20261028",
    "types-protobuf>=7.35.1.20260906",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["server/tests", "client/tests"]

[tool.basedpyright]
include = ["server/src", "server/tests", "client/src", "client/tests", "tools", "scripts"]
exclude = ["proto-py/src/hark/v1", "**/__pycache__", ".venv"]
pythonVersion = "3.12"
extraPaths = ["server/src", "client/src", "proto-py/src"]  # resolve workspace sources as project code, not as an editable install
typeCheckingMode = "strict"
reportMissingTypeStubs = "warning"   # e.g. parakeet-mlx ships no stubs
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
# basedpyright-only extras that fight common, correct patterns:
reportImplicitOverride = "none"
reportUnusedCallResult = "none"
reportAny = "warning"
reportExplicitAny = "warning"

[tool.ty.src]
include = ["server/src", "server/tests", "client/src", "client/tests", "tools", "scripts"]
exclude = ["proto-py/src/hark/v1"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# all default rules at their default level; tighten once ty leaves 0.0.x
possibly-unresolved-reference = "error"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
