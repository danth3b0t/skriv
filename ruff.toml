target-version = "py312"
line-length = 100
extend-exclude = ["server/src/hark/v1"]  # generated by server/scripts/gen-proto

[lint]
# Ruff >= 0.16 default rule set (broad) plus explicit extras we care about.
extend-select = [
  "ANN",   # annotations everywhere (pairs with strict type checking)
  "ASYNC", # asyncio pitfalls
  "B",     # bugbear
  "BLE",   # blind except
  "C4",    # comprehensions
  "DTZ",   # naive datetimes
  "E", "W", "F",
  "FBT",   # boolean positional traps
  "I",     # import sorting
  "N",     # naming
  "PERF",
  "PL",    # pylint
  "PT",    # pytest style
  "PTH",   # pathlib
  "RET", "RUF", "S", "SIM", "TC", "UP",
]
ignore = [
  "E501",    # line length is the formatter's job; long strings/comments allowed
  "PLR2004", # magic values: too noisy in protocol/test code
  "COM812",  # conflicts with the formatter
]

[lint.per-file-ignores]
"server/tests/**" = ["S101", "ANN", "PLR0913", "FBT"]

[format]
docstring-code-format = true

[lint.pep8-naming]
# gRPC servicer methods must match the proto RPC names.
extend-ignore-names = ["GetCapabilities", "Transcribe", "Recognize", "Warmup", "Cleanup", "Check", "Watch"]
