[project]
name = "hark-server"
version = "0.1.0"
description = "hark.v1 inference server (gRPC): Asr + TextCleanup, pluggable ASR backends"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "grpcio>=1.85",
    "grpcio-health-checking>=1.85",
    "grpcio-status>=1.85",
    "protobuf>=6.31",
    "httpx>=0.28",
    "numpy>=2.0",
]

[project.optional-dependencies]
# Real local backend on Apple Silicon.
mlx = ["parakeet-mlx>=0.7,<0.8 ; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
hark-server = "hark_server.__main__:main"

[dependency-groups]
dev = [
    "grpcio-tools>=1.85",
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `hark` holds the generated hark.v1 stubs (protobuf package == Python package).
packages = ["src/hark", "src/hark_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
