[project]
name = "skriv-server"
version = "0.1.0"
description = "skriv.v1 inference server (gRPC): Asr + TextCleanup, pluggable ASR backends"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "skriv-proto",
    "grpcio>=1.85",
    "grpcio-health-checking>=1.85",
    "grpcio-status>=1.85",
    "protobuf>=6.31",
    "httpx>=0.28",
    "numpy>=2.0",
]

[project.optional-dependencies]
# Real local backend on Apple Silicon.
mlx = ["parakeet-mlx>=0.7,<0.8 ; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
skriv-server = "skriv_server.__main__:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `skriv` holds the generated skriv.v1 stubs (protobuf package == Python package).
packages = ["src/skriv_server"]

[tool.uv.sources]
skriv-proto = { workspace = true }
